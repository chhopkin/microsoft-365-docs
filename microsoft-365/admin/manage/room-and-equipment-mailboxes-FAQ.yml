title: Room and equipment mailboxes FAQ
summary: |

  This article provides answers to frequently asked questions that administrator might have about room and equipment mailboxes in Microsoft 365. For more information about room and equipment mailboxes in Microsoft 365, see [Room and equipment mailboxes](room-and-equipment-mailboxes.md).

sections:
- name: Room and equipment mailboxes FAQ
  questions:
  - question: |
      How can you tell when the room or equipment is available?
    answer: |
      Open Outlook and create a new meeting. Add the room or equipment to the meeting as if it were a person and select **Scheduling Assistant** to see a live calendar view of the room or equipment's availability. If the hour slot is clear, the slot is available. If the hour slot is blue, the slot is reserved.

