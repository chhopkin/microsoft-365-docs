summary: Microsoft 365 is expanding its integration with reasoning models within Copilot, allowing users to create Word, Excel, and PowerPoint files using advanced AI-driven creation agents.

sections:
  - name: General functionality
    questions:
      
      
      - question: "How do I enable or disable Claude for our organization?"
        answer: " Go to Microsoft 365 admin center and navigate to **Copilot > Settings > AI providers**. From there, you can manage Claude integration settings."
      
      - question: "What protections exist for my data when using Claude?"
        answer: "When Claude is used, Microsoft handles the data transfer securely. Key protections include:
        
         - Zero data retention by Anthropic: Prompts and content are not stored or reused for model training.
        
         - Microsoft privacy controls: These apply up to the point of transfer to Anthropic.
        
         - Access restrictions: Only data you are authorized to view is included, and sensitivity labels are respected."
      
      - question: "Does using Claude cost extra?"
        answer: "No. Claude usage is included with your Microsoft 365 Copilot license. If pricing changes in the future, customers will receive advance notice."
      
      
      - question: "Where can I find documentation?"
        answer: "Microsoft's Learn article [Connect to Anthropic's AI models](connect-to-ai-models.md#connect-to-anthropic-in-the-microsoft-365-admin-center) provides more information. Ensure your customer facing staff and users read the related article about Claude."




