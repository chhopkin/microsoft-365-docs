title: "Frequently asked questions about Word, Excel, and PowerPoint agents (Frontier)"
summary: Microsoft 365 is expanding its integration with Anthropic's Claude AI within Copilot, allowing users to create Word, Excel, and PowerPoint files using advanced AI-driven creation agents.

sections:
  - name: General functionality
    questions:
      
      
      - question: "How do I enable or disable Claude for our organization?"
        answer: "Navigate to **Copilot > Settings > AI providers** section in **Microsoft 365 admin center**."
      
      
      - question: "What protections exist for my data when using Claude?"
        answer: "When using Claude, information is transmitted to Anthropic, including zero data retention by Anthropic. Your prompts and content aren't stored or reused for model training. Additionally, Microsoft's privacy controls apply up to the point of transfer"
      
      
      - question: "Does using Claude cost extra?"
        answer: "There's currently no extra cost for Claude usage beyond the Microsoft 365 Copilot license. Customers are informed with ample notice if there are any changes."
      
      
      - question: "Where can I find documentation?"
        answer: "Microsoft's Learn article [Connect to Anthropic's AI models](connect-to-ai-models.md#connect-to-anthropic-in-the-microsoft-365-admin-center) provides more information. Ensure your customer facing staff and users read the related article about Claude."




